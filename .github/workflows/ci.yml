# Builds the app and runs its unit tests on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # The runner's Android SDK (ANDROID_HOME) has the platform; Gradle resolves the libraries.
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
